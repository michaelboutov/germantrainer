# Optional: publish the static front-end to GitHub Pages (demo mode + "bring your own Gemini key").
# One-time setup: repo Settings → Pages → Source: "GitHub Actions". Then run this workflow from the Actions tab
# (it is manual on purpose, so a repo without Pages enabled doesn't get a red X on every push).
name: Deploy static site to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

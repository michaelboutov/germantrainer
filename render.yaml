# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/michaelboutov/germantrainer
services:
  - type: web
    name: fluss-german-trainer
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false        # paste your Gemini key in the Render dashboard (never in git)
      - key: ACCESS_CODE
        sync: false        # optional shared password
